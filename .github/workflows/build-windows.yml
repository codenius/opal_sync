name: Build Windows binary

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Keep release version allocation and publication in commit order.
concurrency:
  group: windows-release-main
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          activate-environment: true

      - name: Install build dependencies
        run: uv sync --locked --extra build

      - name: Install UPX
        run: choco install upx --yes --no-progress

      - name: Build executable
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $env:PATH = (($env:PATH -split ';' | Where-Object { $_ -notmatch 'Java_Temurin|Windows Performance Toolkit|[\\/]Java[\\/]' }) -join ';')
          & $python -m PyInstaller --clean --noconfirm opal_sync.spec

      - name: Check whether executable changed
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $newHash = (Get-FileHash dist/opal_sync.exe -Algorithm SHA256).Hash
          $releases = @(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $changed = $true
          if ($releases.Count -gt 0) {
            $tag = $releases[0].tagName
            $release = gh release view $tag --json assets | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $asset = $release.assets | Where-Object name -eq 'opal_sync.exe' | Select-Object -First 1
            if ($null -ne $asset) {
              $downloadDir = Join-Path $env:RUNNER_TEMP "latest-release-$env:GITHUB_RUN_ID"
              New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
              gh release download $tag --pattern opal_sync.exe --dir $downloadDir
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

              $latestPath = Join-Path $downloadDir 'opal_sync.exe'
              if (-not (Test-Path -LiteralPath $latestPath)) {
                Write-Error "Release $tag lists opal_sync.exe but the asset was not downloaded."
                exit 1
              }
              $latestHash = (Get-FileHash $latestPath -Algorithm SHA256).Hash
              $changed = $newHash -ne $latestHash
            }
          }

          "changed=$($changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Set release version
        id: version
        if: steps.release_check.outputs.changed == 'true'
        shell: pwsh
        run: |
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          $tags = gh release list --limit 1000 --json tagName | ConvertFrom-Json
          $matches = @($tags | ForEach-Object { $_.tagName } | Where-Object { $_ -match "^$date(?:\.(\d+))?$" })
          if ($matches.Count -eq 0) {
            $version = $date
          } else {
            $maxSuffix = 0
            foreach ($tag in $matches) {
              if ($tag -match "^$date\.(\d+)$") {
                $maxSuffix = [Math]::Max($maxSuffix, [int]$Matches[1])
              } else {
                $maxSuffix = [Math]::Max($maxSuffix, 0)
              }
            }
            $version = "$date.$($maxSuffix + 1)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload executable
        uses: actions/upload-artifact@v6
        if: steps.release_check.outputs.changed == 'true'
        with:
          name: opal-sync-${{ steps.version.outputs.version }}
          path: dist/opal_sync.exe
          if-no-files-found: error
          retention-days: 1

      - name: Publish GitHub release
        if: steps.release_check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.version.outputs.version }}" dist/opal_sync.exe --title "${{ steps.version.outputs.version }}" --generate-notes
