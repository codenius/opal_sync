# OPAL Sync Configuration
# By default, opal-sync looks for config.toml in the current working directory.
# Relative paths below are resolved from the directory containing this file.

[general]
sync_directory = "."
log_level = "INFO"
log_file = "opal-sync.log"
db_file = "state.db"

[auth]
university = "htwk-leipzig"                  # Maps to WAYF value 7
username = "mmustermann"                     # i.e. HTWK login for Max Mustermann
# Password is stored in the operating system's credential store via keyring
# Set interactively with: opal-sync login

[auth.session]
cookie_file = "session.json"
session_ttl_hours = 1
max_retry_auth = 3

[sync]
include_extensions = []                     # Empty means include all extensions
exclude_extensions = []                     # Include matches override exclusions
max_file_size_mb = 50
parallel_downloads = 3
request_delay_seconds = 0.5
delete_removed = false

[courses]
# If both lists are empty, all enrolled courses are synced.
# Matching is substring-based (case-insensitive); excluded courses are never synced.
include = []
exclude = []

# Optional per-course root folder overrides.
# Relative paths are placed under sync_directory; absolute paths are used as-is.
# Keys match the full OPAL course name, ignoring case. Include the desired folder name.
[courses.paths]
# "N021 Mathematik 1 - EIB, STB" = "Mathematik 1"
# "Software Architecture" = "Courses/Software Architecture"
